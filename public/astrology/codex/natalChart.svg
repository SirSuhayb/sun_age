<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#FFFCF2"/>
  
  <!-- Outer circle (zodiac ring) -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#D4A02A" stroke-width="20"/>
  
  <!-- Inner circles -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#D4A02A" stroke-width="1"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#D4A02A" stroke-width="1"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#D4A02A" stroke-width="1"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#D4A02A" stroke-width="1"/>
  
  <!-- Center circle -->
  <circle cx="200" cy="200" r="50" fill="#FFF8E7" stroke="#D4A02A" stroke-width="1"/>
  
  <!-- House divisions (12 equal parts) -->
  <g id="house-lines" stroke="#D4A02A" stroke-width="1">
    <line x1="200" y1="10" x2="200" y2="390" transform="rotate(0 200 200)"/>
    <line x1="200" y1="10" x2="200" y2="390" transform="rotate(30 200 200)"/>
    <line x1="200" y1="10" x2="200" y2="390" transform="rotate(60 200 200)"/>
    <line x1="200" y1="10" x2="200" y2="390" transform="rotate(90 200 200)"/>
    <line x1="200" y1="10" x2="200" y2="390" transform="rotate(120 200 200)"/>
    <line x1="200" y1="10" x2="200" y2="390" transform="rotate(150 200 200)"/>
  </g>
  
  <!-- Zodiac signs in outer ring -->
  <g id="zodiac-signs" font-family="serif" font-size="14" fill="#444" text-anchor="middle">
    <!-- Aries -->
    <text x="200" y="25" transform="rotate(15 200 200)">♈</text>
    <!-- Taurus -->
    <text x="200" y="25" transform="rotate(45 200 200)">♉</text>
    <!-- Gemini -->
    <text x="200" y="25" transform="rotate(75 200 200)">♊</text>
    <!-- Cancer -->
    <text x="200" y="25" transform="rotate(105 200 200)">♋</text>
    <!-- Leo -->
    <text x="200" y="25" transform="rotate(135 200 200)">♌</text>
    <!-- Virgo -->
    <text x="200" y="25" transform="rotate(165 200 200)">♍</text>
    <!-- Libra -->
    <text x="200" y="25" transform="rotate(195 200 200)">♎</text>
    <!-- Scorpio -->
    <text x="200" y="25" transform="rotate(225 200 200)">♏</text>
    <!-- Sagittarius -->
    <text x="200" y="25" transform="rotate(255 200 200)">♐</text>
    <!-- Capricorn -->
    <text x="200" y="25" transform="rotate(285 200 200)">♑</text>
    <!-- Aquarius -->
    <text x="200" y="25" transform="rotate(315 200 200)">♒</text>
    <!-- Pisces -->
    <text x="200" y="25" transform="rotate(345 200 200)">♓</text>
  </g>
  
  <!-- Degree markers -->
  <g id="degree-markers" stroke="#D4A02A" stroke-width="0.5" opacity="0.5">
    <!-- Add degree markers every 10 degrees -->
  </g>
  
  <!-- Planet positions will be added dynamically -->
  <g id="planets">
    <!-- Planets will be positioned here dynamically -->
  </g>
  
  <!-- Aspect lines will be added dynamically -->
  <g id="aspects" stroke-width="1" fill="none" opacity="0.6">
    <!-- Aspect lines will be drawn here dynamically -->
  </g>
  
  <!-- Center sun symbol -->
  <text x="200" y="207" text-anchor="middle" font-size="24" fill="#E6B13A">☉</text>
</svg>